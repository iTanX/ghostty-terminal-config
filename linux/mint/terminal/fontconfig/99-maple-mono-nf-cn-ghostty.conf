<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Ghostty requests spacing=100, which adds the generic monospace alias.
       In a Chinese locale, Mint can then prefer Noto Sans Mono CJK SC over
       the explicitly requested Maple family. Preserve Maple's native dual
       width (90) and keep explicit requests ahead of generic aliases. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Maple Mono NF CN</string>
    </test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
    <edit name="spacing" mode="assign" binding="strong">
      <int>90</int>
    </edit>
  </match>
</fontconfig>
