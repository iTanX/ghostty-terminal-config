<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Ghostty requests spacing=100. Ubuntu's 48-spacing.conf prepends
       monospace, then 69-language-selector-zh-cn.conf strongly prepends
       DejaVu and Noto under zh_CN. Keep explicit Maple CN requests ahead
       of those generic aliases, using the font's native dual width. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Maple Mono NF CN</string>
    </test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Maple Mono NF CN</string>
    </edit>
    <edit name="spacing" mode="assign" binding="strong">
      <int>90</int>
    </edit>
  </match>
</fontconfig>
